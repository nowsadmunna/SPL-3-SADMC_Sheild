apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ required "sadmc.apiKey is required. Get your key from the SADMC Shield dashboard." .Values.sadmc.apiKey | b64enc | quote }}
