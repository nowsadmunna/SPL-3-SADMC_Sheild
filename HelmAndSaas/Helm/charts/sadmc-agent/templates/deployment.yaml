apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sadmc-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sadmc-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sadmc-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # a changed ConfigMap / Secret (helm upgrade) must restart the agent: env vars are read once at start
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sadmc-agent.fullname" . }}
      containers:
        - name: sadmc-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "sadmc-agent.fullname" . }}-config
          env:
            - name: SADMC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-secret
                  key: api-key
            - name: SAAS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-config
                  key: SAAS_ENDPOINT
            - name: EXCLUDE_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-config
                  key: EXCLUDE_NAMESPACES
            - name: REMEDIATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-config
                  key: REMEDIATION_ENABLED
            - name: CONFIDENCE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-config
                  key: CONFIDENCE_THRESHOLD
            - name: REMEDIATION_RULES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sadmc-agent.fullname" . }}-config
                  key: REMEDIATION_RULES
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
