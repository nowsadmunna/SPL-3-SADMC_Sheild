{{- if include "sadmc-agent.prometheus.shouldInstall" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.prometheus.install.storageClass }}
  storageClassName: {{ .Values.prometheus.install.storageClass | quote }}
  {{- end }}
  {{- /* If storageClass is empty, Kubernetes uses the cluster default — best-practice dynamic provisioning */}}
  resources:
    requests:
      storage: {{ .Values.prometheus.install.storageSize | quote }}
{{- end }}
