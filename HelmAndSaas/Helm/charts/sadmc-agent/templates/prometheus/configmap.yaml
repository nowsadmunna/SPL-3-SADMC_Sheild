{{- if include "sadmc-agent.prometheus.shouldInstall" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
{{- end }}
