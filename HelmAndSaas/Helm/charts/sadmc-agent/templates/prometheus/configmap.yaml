{{- if include "sadmc-agent.prometheus.shouldInstall" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      # Container-level CPU/memory/network/fs metrics (container_cpu_*,
      # container_memory_*, ...) come from cAdvisor via the kubelet, not
      # from application pods themselves — the 'kubernetes-pods' job above
      # never reaches this endpoint no matter what's configured on it.
      # Goes through the API server's node-proxy subresource rather than
      # connecting to each kubelet directly, since that's reachable from
      # inside the cluster even when node IPs/ports aren't.
      - job_name: 'kubernetes-nodes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
{{- end }}
