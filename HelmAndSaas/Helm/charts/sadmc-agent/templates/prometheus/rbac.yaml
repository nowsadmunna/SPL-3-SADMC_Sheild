{{- if include "sadmc-agent.prometheus.shouldInstall" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
rules:
  # Kubernetes service-discovery targets (pods/services/endpoints/nodes)
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # Direct kubelet scrape endpoints (cAdvisor container metrics, node /metrics)
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sadmc-agent.fullname" . }}-prometheus
  labels:
    {{- include "sadmc-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sadmc-agent.fullname" . }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "sadmc-agent.fullname" . }}-prometheus
    namespace: {{ .Release.Namespace }}
{{- end }}
