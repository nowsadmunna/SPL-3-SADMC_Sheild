# values.yaml for sadmc-agent

# ─── REQUIRED ───────────────────────────────────────────────────
sadmc:
  apiKey: ""                          # Paste your API Key from the dashboard
  saasEndpoint: "https://api.sadmc.io"
  # Name shown in the dashboard (e.g. "prod-eu"). Empty = the name of the API key; it can be renamed in the dashboard later.
  clusterName: ""
  # Stable identity of this cluster in the dashboard. Empty = the UID of the kube-system namespace (read at install time),
  # so reinstalling or restarting the agent never creates a second cluster.
  clusterId: ""

# ─── AGENT DOCKER IMAGE ─────────────────────────────────────────
agent:
  image:
    repository: "sadmc-agent"        # build: docker build -t sadmc-agent:1.1.5 HelmAndSaas/Agent  (publish it to a registry for other clusters)
    tag: "1.1.5"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ─── cAdvisor ────────────────────────────────────────────────────
# Container metrics per pod: CPU user/system, network, memory, throttling. The kubelet's built-in cAdvisor on many clusters does
# not export all of these. This DaemonSet runs a standalone cAdvisor on every node and is PRIVILEGED (it mounts the node's / and
# /sys read-only); set enabled=false if you do not allow that and point the agent at your own with cadvisor.externalUrls.
cadvisor:
  enabled: true
  image: "gcr.io/cadvisor/cadvisor:v0.49.1"
  externalUrls: []     # e.g. ["http://10.0.0.5:8080/metrics"]; used instead of the DaemonSet when set

# ─── SERVICE DISCOVERY ──────────────────────────────────────────
discovery:
  excludeNamespaces:
    - "kube-system"
    - "kube-public"
    - "sadmc"
  # Score only these deployments (by name). Empty = every deployment outside excludeNamespaces. The models are trained on
  # application services, so databases / queues / monitoring are better left out.
  includeServices: []
  # Monitor only these namespaces (empty = every namespace outside excludeNamespaces, which always wins). Combine with
  # includeServices / excludeServices to narrow further inside them.
  namespaces: []
  # Deployment names to leave out, e.g. a database in a monitored namespace.
  excludeServices: []

# ─── REMEDIATION ─────────────────────────────────────────────────
remediation:
  enabled: false          # observe first; --set remediation.enabled=true to let the agent act
  confidenceThreshold: 0.85
  consecutive: 3          # act only after this many consecutive confident verdicts for the same service
  services: []            # allow-list of deployments the agent may act on (empty = all discovered)
  rules:
    CPU_HOG:
      action: "THROTTLE_CPU"
      cpu_limit: "200m"
      cooldown_seconds: 300
    MEMORY_LEAK:
      action: "RESTART_POD"
      cooldown_seconds: 180
    NETWORK_DELAY:
      action: "SCALE_UP"
      replica_increase: 1
      max_replicas: 10
      cooldown_seconds: 600
    NORMAL:
      action: "NO_ACTION"

