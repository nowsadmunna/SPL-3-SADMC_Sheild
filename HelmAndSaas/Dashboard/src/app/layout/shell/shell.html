<div class="min-h-screen bg-slate-50 dark:bg-slate-900">
  <app-toast-container />

  <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3 dark:border-slate-700 dark:bg-slate-800">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-sm font-bold text-white">S</span>
        <span class="text-lg font-semibold text-slate-900 dark:text-slate-100">SADMC Shield</span>
      </div>

      @if (clusters.clusters().length > 0) {
        <select
          class="rounded-md border border-slate-300 bg-white px-2 py-1 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100"
          [value]="clusters.selectedClusterId()"
          (change)="onClusterChange($event)"
        >
          @for (cluster of clusters.clusters(); track cluster.id) {
            <option [value]="cluster.id">{{ cluster.cluster_uuid.slice(0, 8) }}… ({{ cluster.status }})</option>
          }
        </select>
      } @else {
        <a routerLink="/dashboard/setup" class="text-sm font-medium text-brand-600 underline hover:text-brand-700 dark:text-brand-300 dark:hover:text-brand-200"
          >No clusters yet — connect one</a
        >
      }
    </div>

    <div class="flex items-center gap-3 text-sm">
      <span class="text-slate-500 dark:text-slate-400">{{ auth.tenant()?.organization_name }}</span>
      <app-theme-toggle />
      <button (click)="logout()" class="font-medium text-slate-600 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-400">Log out</button>
    </div>
  </header>

  <div class="flex">
    <nav class="w-52 shrink-0 border-r border-slate-200 bg-white px-2 py-4 dark:border-slate-700 dark:bg-slate-800">
      <a
        routerLink="/dashboard"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mb-1 block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Overview</a
      >
      <a
        routerLink="/dashboard/setup"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        class="mb-1 block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Connect a Cluster</a
      >
      <a
        routerLink="/dashboard/anomalies"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        class="mb-1 block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Anomaly Feed</a
      >
      <a
        routerLink="/dashboard/remediations"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        class="mb-1 block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Remediation Log</a
      >
      <a
        routerLink="/dashboard/metrics"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        class="mb-1 block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Metrics</a
      >
      <a
        routerLink="/dashboard/settings"
        routerLinkActive="border-brand-600 bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300"
        class="block rounded-md border-l-4 border-transparent px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"
        >Settings</a
      >
    </nav>

    <main class="min-w-0 flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
