<h1 class="mb-6 text-xl font-semibold text-slate-900 dark:text-slate-100">Service Health</h1>

@if (loading()) {
  <p class="text-sm text-slate-400 dark:text-slate-500">Loading…</p>
} @else if (serviceHealth().length === 0) {
  <p class="text-sm text-slate-400 dark:text-slate-500">No services discovered yet for this cluster.</p>
} @else {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (svc of serviceHealth(); track svc.service_name) {
      <div
        class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition-shadow hover:shadow-md border-l-4 dark:border-slate-700 dark:bg-slate-800"
        [class]="borderClass[svc.status]"
      >
        <div class="mb-2 flex items-center justify-between">
          <span class="font-medium text-slate-900 dark:text-slate-100">{{ svc.service_name }}</span>
          <app-anomaly-badge [type]="svc.status" />
        </div>
        <p class="text-xs text-slate-400 dark:text-slate-500">{{ svc.namespace }}</p>
      </div>
    }
  </div>
}
