<div class="mb-6 flex items-center justify-between">
  <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Metrics</h1>

  @if (services().length > 0) {
    <select
      class="rounded-md border border-slate-300 bg-white px-2 py-1 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100"
      [value]="selectedService()"
      (change)="onServiceChange($event)"
    >
      @for (svc of services(); track svc.service_name) {
        <option [value]="svc.service_name">{{ svc.service_name }}</option>
      }
    </select>
  }
</div>

@if (loading()) {
  <p class="text-sm text-slate-400 dark:text-slate-500">Loading…</p>
} @else if (services().length === 0) {
  <p class="text-sm text-slate-400 dark:text-slate-500">No services discovered yet for this cluster.</p>
} @else {
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    @for (panel of panels; track panel.key) {
      <div class="rounded-lg border border-t-4 border-slate-200 border-t-brand-500 bg-white p-4 shadow-sm dark:border-slate-700 dark:border-t-brand-400 dark:bg-slate-800">
        <p class="mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">{{ panel.title }}</p>
        <div class="h-56">
          @if (chartData()[panel.key]; as data) {
            <canvas baseChart [type]="'line'" [data]="data" [options]="chartOptions()"></canvas>
          }
        </div>
      </div>
    }
  </div>
}
