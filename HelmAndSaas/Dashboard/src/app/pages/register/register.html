<div class="flex min-h-screen items-center justify-center bg-slate-50">
  <form
    class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-8 shadow-sm"
    (ngSubmit)="submit()"
  >
    <h1 class="mb-1 text-xl font-semibold text-slate-900">Create your account</h1>
    <p class="mb-6 text-sm text-slate-500">SADMC Shield tenant registration</p>

    @if (error()) {
      <div class="mb-4 rounded-md bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ error() }}</div>
    }

    <label class="mb-1 block text-sm font-medium text-slate-700" for="org">Organization name</label>
    <input
      id="org"
      name="org"
      type="text"
      required
      [(ngModel)]="organizationName"
      class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700" for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      required
      [(ngModel)]="email"
      class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      minlength="8"
      [(ngModel)]="password"
      class="mb-6 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
    />

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-50"
    >
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="mt-4 text-center text-sm text-slate-500">
      Already have an account? <a routerLink="/login" class="font-medium text-slate-900 hover:underline">Sign in</a>
    </p>
  </form>
</div>
