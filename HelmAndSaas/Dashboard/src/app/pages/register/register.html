<div class="relative flex min-h-screen items-center justify-center bg-gradient-to-br from-brand-50 via-white to-slate-50 px-4 dark:from-slate-900 dark:via-slate-900 dark:to-slate-950">
  <div class="absolute right-4 top-4">
    <app-theme-toggle />
  </div>

  <form
    class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-lg shadow-brand-900/5 dark:border-slate-700 dark:bg-slate-800"
    (ngSubmit)="submit()"
  >
    <div class="mb-6 flex items-center gap-2">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-base font-bold text-white">S</span>
      <div>
        <h1 class="text-lg font-semibold leading-tight text-slate-900 dark:text-slate-100">Create your account</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">SADMC Shield tenant registration</p>
      </div>
    </div>

    @if (error()) {
      <div class="mb-4 rounded-md bg-rose-50 px-3 py-2 text-sm text-rose-700 dark:bg-rose-900/30 dark:text-rose-300">{{ error() }}</div>
    }

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="org">Organization name</label>
    <input
      id="org"
      name="org"
      type="text"
      required
      [(ngModel)]="organizationName"
      class="mb-4 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      required
      [(ngModel)]="email"
      class="mb-4 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      minlength="8"
      [(ngModel)]="password"
      class="mb-6 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100"
    />

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-brand-700 disabled:opacity-50"
    >
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400">
      Already have an account? <a routerLink="/login" class="font-medium text-brand-600 hover:text-brand-700 hover:underline dark:text-brand-300 dark:hover:text-brand-200">Sign in</a>
    </p>
  </form>
</div>
